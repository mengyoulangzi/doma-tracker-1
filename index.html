<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Doma Dashboard</title>

  <script src="https://cdn.tailwindcss.com"></script>

  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    body {
      margin: 0;
      background: #f8fbff;
      font-family: Arial, sans-serif;
    }

    .glass {
      background: rgba(255,255,255,0.9);
      backdrop-filter: blur(10px);
    }
  </style>
</head>
<body>

<div id="root"></div>

<script type="text/babel">

const { useState } = React;

function App() {

  const [wallet, setWallet] = useState(
    "0xe23153b21Cb41fFbc2cD08e2d0017a2B3Bc6c8c5"
  );

  const stats = [
    {
      title: "Domains",
      value: "7"
    },
    {
      title: "Wallet Score",
      value: "91/100"
    },
    {
      title: "Portfolio",
      value: "$48.2K"
    },
    {
      title: "Transactions",
      value: "1248"
    }
  ];

  const domains = [
    "marginla.xyz",
    "software.ai",
    "brag.com",
    "investors.xyz"
  ];

  const trades = [
    {
      action: "Bought",
      item: "software.ai",
      value: "$1120"
    },
    {
      action: "Sold",
      item: "Token fragment",
      value: "$340"
    },
    {
      action: "Staked",
      item: "DOMA",
      value: "$0"
    }
  ];

  return (
    <div className="min-h-screen text-slate-900">

      <div className="fixed inset-0 -z-10 bg-gradient-to-br from-blue-100 via-white to-cyan-100"></div>

      <header className="sticky top-0 glass border-b border-blue-100">
        <div className="max-w-7xl mx-auto px-6 py-4 flex items-center justify-between">

          <div>
            <h1 className="text-3xl font-black text-blue-600">
              DOMA Identity Dashboard
            </h1>

            <p className="text-slate-500 mt-1">
              Wallet • Domains • Identity • Portfolio
            </p>
          </div>

          <button
            onClick={() => navigator.clipboard.writeText(wallet)}
            className="bg-blue-600 hover:bg-blue-700 text-white px-5 py-3 rounded-2xl font-bold"
          >
            Copy Wallet
          </button>

        </div>
      </header>

      <main className="max-w-7xl mx-auto px-6 py-8">

        <section className="glass rounded-[30px] p-8 shadow-xl border border-blue-100">

          <div className="grid xl:grid-cols-2 gap-8 items-center">

            <div>

              <div className="flex flex-wrap gap-3 mb-5">
                <span className="bg-blue-600 text-white px-4 py-2 rounded-full text-sm font-bold">
                  DomainFi
                </span>

                <span className="bg-white border border-blue-200 px-4 py-2 rounded-full text-sm font-bold text-blue-600">
                  Web3 Identity
                </span>
              </div>

              <h2 className="text-5xl font-black leading-tight text-slate-900">
                Professional Wallet & Domain Tracker
              </h2>

              <p className="mt-5 text-slate-600 text-lg leading-8">
                Search wallet activity, tokenized assets, domain ownership,
                identity data and portfolio analytics.
              </p>

              <div className="mt-8 flex gap-4 flex-wrap">

                <button className="bg-blue-600 hover:bg-blue-700 text-white px-6 py-4 rounded-2xl font-bold">
                  Lookup Wallet
                </button>

                <button className="border border-blue-200 bg-white px-6 py-4 rounded-2xl font-bold text-blue-600">
                  Identity Verified
                </button>

              </div>

            </div>

            <div className="bg-gradient-to-br from-blue-500 to-cyan-400 rounded-[30px] p-8 text-white relative overflow-hidden">

              <div className="absolute right-[-20px] top-[-20px] text-[180px] font-black opacity-10">
                DOMA
              </div>

              <div className="relative z-10">

                <div className="w-32 h-32 rounded-[30px] bg-white/20 flex items-center justify-center text-7xl shadow-2xl">
                  🐸
                </div>

                <h3 className="mt-6 text-3xl font-black">
                  Blue Web3 Presenter
                </h3>

                <p className="mt-4 leading-8 text-blue-50">
                  Clean modern interface for domains, wallets and Web3 identity analytics.
                </p>

                <div className="grid grid-cols-3 gap-4 mt-8">

                  <div className="bg-white/20 rounded-2xl p-4 backdrop-blur">
                    <div className="text-sm opacity-80">Theme</div>
                    <div className="font-black mt-1">Blue</div>
                  </div>

                  <div className="bg-white/20 rounded-2xl p-4 backdrop-blur">
                    <div className="text-sm opacity-80">Style</div>
                    <div className="font-black mt-1">Modern</div>
                  </div>

                  <div className="bg-white/20 rounded-2xl p-4 backdrop-blur">
                    <div className="text-sm opacity-80">Focus</div>
                    <div className="font-black mt-1">Identity</div>
                  </div>

                </div>

              </div>

            </div>

          </div>

        </section>

        <section className="grid md:grid-cols-2 xl:grid-cols-4 gap-5 mt-8">

          {stats.map((item, index) => (
            <div
              key={index}
              className="glass rounded-[28px] p-6 border border-blue-100 shadow-lg"
            >
              <div className="text-sm uppercase tracking-widest text-slate-500 font-bold">
                {item.title}
              </div>

              <div className="text-4xl font-black mt-4 text-slate-900">
                {item.value}
              </div>
            </div>
          ))}

        </section>

        <section className="grid xl:grid-cols-2 gap-6 mt-8">

          <div className="glass rounded-[30px] p-8 border border-blue-100 shadow-lg">

            <h3 className="text-3xl font-black text-slate-900">
              Domains Held
            </h3>

            <div className="space-y-4 mt-8">

              {domains.map((domain, index) => (
                <div
                  key={index}
                  className="bg-white rounded-2xl p-5 border border-slate-100 flex items-center justify-between"
                >
                  <div>
                    <div className="font-black text-lg text-slate-900">
                      {domain}
                    </div>

                    <div className="text-slate-500 mt-1 text-sm">
                      Domain Asset
                    </div>
                  </div>

                  <span className="bg-blue-100 text-blue-700 px-4 py-2 rounded-full font-bold text-sm">
                    Active
                  </span>
                </div>
              ))}

            </div>

          </div>

          <div className="glass rounded-[30px] p-8 border border-blue-100 shadow-lg">

            <h3 className="text-3xl font-black text-slate-900">
              Trading History
            </h3>

            <div className="space-y-4 mt-8">

              {trades.map((trade, index) => (
                <div
                  key={index}
                  className="bg-white rounded-2xl p-5 border border-slate-100 flex items-center justify-between"
                >
                  <div>
                    <div className="font-black text-lg text-slate-900">
                      {trade.action}
                    </div>

                    <div className="text-slate-500 mt-1 text-sm">
                      {trade.item}
                    </div>
                  </div>

                  <div className="font-black text-blue-600 text-xl">
                    {trade.value}
                  </div>
                </div>
              ))}

            </div>

          </div>

        </section>

        <section className="glass rounded-[30px] p-8 border border-blue-100 shadow-lg mt-8">

          <h3 className="text-3xl font-black text-slate-900">
            About This Wallet
          </h3>

          <p className="mt-6 text-slate-600 leading-9 text-lg">
            Hello, I am marginla, a Web3 enthusiast and crypto content creator with a strong passion for blockchain innovation, digital culture, and emerging technologies.
          </p>

          <div className="grid md:grid-cols-2 xl:grid-cols-4 gap-5 mt-8">

            <div className="bg-white rounded-2xl p-5 border border-slate-100">
              <div className="text-sm uppercase tracking-widest text-slate-500 font-bold">
                Region
              </div>

              <div className="font-black text-xl mt-3">
                APAC
              </div>
            </div>

            <div className="bg-white rounded-2xl p-5 border border-slate-100">
              <div className="text-sm uppercase tracking-widest text-slate-500 font-bold">
                Location
              </div>

              <div className="font-black text-xl mt-3">
                Vietnam
              </div>
            </div>

            <div className="bg-white rounded-2xl p-5 border border-slate-100">
              <div className="text-sm uppercase tracking-widest text-slate-500 font-bold">
                Role
              </div>

              <div className="font-black text-xl mt-3">
                Doma OG
              </div>
            </div>

            <div className="bg-white rounded-2xl p-5 border border-slate-100">
              <div className="text-sm uppercase tracking-widest text-slate-500 font-bold">
                Wallet
              </div>

              <div className="font-black text-lg mt-3 break-all">
                {wallet}
              </div>
            </div>

          </div>

        </section>

        <footer className="mt-10 text-center text-slate-500 pb-10">
          Built for Doma style identity analytics.
        </footer>

      </main>

    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);

</script>

</body>
</html>
```

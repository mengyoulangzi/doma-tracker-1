    function useAmbientAudio(enabled) {
      const ctxRef = useRef(null);
      useEffect(() => {
        const start = async () => {
          if (!enabled) {
            try { await ctxRef.current?.close(); } catch {}
            ctxRef.current = null;
            return;
          }
          if (ctxRef.current) return;
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (!AudioCtx) return;
          const ctx = new AudioCtx();
          const gain = ctx.createGain();
          gain.gain.value = 0.015;
          const filter = ctx.createBiquadFilter();
          filter.type = "lowpass";
          filter.frequency.value = 520;
          const osc1 = ctx.createOscillator();
          osc1.type = "sine";
          osc1.frequency.value = 196;
          const osc2 = ctx.createOscillator();
          osc2.type = "triangle";
          osc2.frequency.value = 294;
          osc1.connect(gain);
          osc2.connect(gain);
          gain.connect(filter);
          filter.connect(ctx.destination);
          osc1.start();
          osc2.start();
          ctxRef.current = ctx;
        };
        start();
        return () => {
          try { ctxRef.current?.close(); } catch {}
          ctxRef.current = null;
        };
      }, [enabled]);
    }

    function slicePath(cx, cy, r, startAngle, endAngle) {
      const toRad = (a) => (Math.PI / 180) * a;
      const start = { x: cx + r * Math.cos(toRad(startAngle)), y: cy + r * Math.sin(toRad(startAngle)) };
      const end = { x: cx + r * Math.cos(toRad(endAngle)), y: cy + r * Math.sin(toRad(endAngle)) };
      const largeArc = endAngle - startAngle <= 180 ? 0 : 1;
      return `M ${cx} ${cy} L ${start.x} ${start.y} A ${r} ${r} 0 ${largeArc} 1 ${end.x} ${end.y} Z`;
    }

    function AreaChartSvg({ data }) {
      const width = 1000;
      const height = 320;
      const padLeft = 52;
      const padRight = 24;
      const padTop = 24;
      const padBottom = 38;
      const values = data.map((d) => d.volume);
      const max = Math.max(...values, 1);
      const min = 0;
      const usableW = width - padLeft - padRight;
      const usableH = height - padTop - padBottom;
      const x = (i) => padLeft + (data.length === 1 ? usableW / 2 : (i * usableW) / (data.length - 1));
      const y = (v) => padTop + (1 - (v - min) / (max - min || 1)) * usableH;
      const points = data.map((d, i) => [x(i), y(d.volume)]);
      const linePath = points.map(([px, py], i) => `${i === 0 ? "M" : "L"} ${px} ${py}`).join(" ");
      const baseline = height - padBottom;
      const areaPath = points.length > 0 ? `${linePath} L ${points[points.length - 1][0]} ${baseline} L ${points[0][0]} ${baseline} Z` : "";
      const gridLines = Array.from({ length: 5 }, (_, i) => {
        const t = i / 4;
        return { gy: padTop + t * usableH, label: Math.round(max * (1 - t)) };
      });
      return (
        <svg viewBox={`0 0 ${width} ${height}`} className="h-full w-full overflow-visible">
          <defs>
            <linearGradient id="volumeFill" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stopColor={PRIMARY} stopOpacity="0.32" />
              <stop offset="100%" stopColor={PRIMARY} stopOpacity="0.02" />
            </linearGradient>
          </defs>
          {gridLines.map((g, idx) => (
            <g key={idx}>
              <line x1={padLeft} x2={width - padRight} y1={g.gy} y2={g.gy} stroke="#e6eeff" strokeDasharray="4 4" />
              <text x="6" y={g.gy + 4} fontSize="10" fill="#8390a8">{g.label.toLocaleString()}</text>
            </g>
          ))}
          {data.map((d, i) => <text key={d.day} x={x(i)} y={height - 10} fontSize="11" textAnchor="middle" fill="#8390a8">{d.day}</text>)}
          {areaPath ? <path d={areaPath} fill="url(#volumeFill)" /> : null}
          {linePath ? <path d={linePath} fill="none" stroke={PRIMARY} strokeWidth="4" strokeLinejoin="round" strokeLinecap="round" /> : null}
          {points.map(([px, py], i) => <circle key={i} cx={px} cy={py} r="4.5" fill="#ffffff" stroke={PRIMARY} strokeWidth="3" />)}
        </svg>
      );
    }

    function PieChartSvg({ data }) {
      const [activeIndex, setActiveIndex] = useState(0);
      const total = data.reduce((sum, item) => sum + item.value, 0) || 1;
      const cx = 180;
      const cy = 140;
      const r = 96;
      let current = -90;
      const arcs = data.map((item, index) => {
        const sweep = (item.value / total) * 360;
        const start = current;
        const end = current + sweep;
        current = end;
        return { ...item, index, start, end, path: slicePath(cx, cy, r, start, end) };
      });
      const active = arcs[activeIndex] || arcs[0];
      return (
        <div className="flex h-full flex-col">
          <svg viewBox="0 0 360 280" className="w-full no-select">
            {arcs.map((arc, idx) => (
              <path key={idx} d={arc.path} fill={COLORS[idx % COLORS.length]} opacity={idx === activeIndex ? 1 : 0.82} onMouseEnter={() => setActiveIndex(idx)} style={{ cursor: "pointer" }} />
            ))}
            <circle cx={cx} cy={cy} r="52" fill="white" />
            <text x={cx} y={cy - 4} fontSize="16" fontWeight="700" textAnchor="middle" fill="#0f172a">{active ? active.name : "Mix"}</text>
            <text x={cx} y={cy + 16} fontSize="11" textAnchor="middle" fill="#64748b">{active ? `${active.value}%` : "Portfolio"}</text>
          </svg>
          <div className="mt-2 flex flex-wrap gap-2">
            {data.map((item, i) => (
              <button key={item.name} onMouseEnter={() => setActiveIndex(i)} className="inline-flex items-center gap-2 rounded-full border border-slate-200 bg-white px-3 py-2 text-xs font-semibold text-slate-700 transition hover:border-[#4b76f9]/30 hover:text-[#3f63d8]">
                <span className="inline-block h-2.5 w-2.5 rounded-full" style={{ background: COLORS[i % COLORS.length] }} />
                {item.name} · {item.value}%
              </button>
            ))}
          </div>
        </div>
      );
    }

                  <div className="p-5">
                    <div className="grid gap-3 sm:grid-cols-2">
                      <DetailCard title="Role" text="Explainer + guide for domain holders and Web3 users." icon={Sparkles} />
                      <DetailCard title="Focus" text="Wallet data, tokenized assets, and domain ownership signals." icon={Wallet} />
                      <DetailCard title="Audience" text="New users, community members, and early supporters." icon={Users} />
                      <DetailCard title="Style" text="Bright, modern, readable, and Doma-inspired." icon={LayoutDashboard} />
                    </div>
                  </div>
                </Card>

                {showPanel ? (
                  <Card className="p-5 sm:p-6">
                    <SectionTitle subtitle="Studio panel" title="Visual settings" right={<Sparkles className="text-[#4b76f9]" size={20} />} />
                    <div className="mt-4 grid gap-3 sm:grid-cols-2">
                      <DetailCard title="Background" text="Add bg.gif or bg.mp4 to enrich the landing view." icon={Grid2X2} />
                      <DetailCard title="Music" text="Add music.mp3 for ambient futuristic sound." icon={Headphones} />
                      <DetailCard title="Avatar" text="Add avatar.png for a custom profile image." icon={User} />
                      <DetailCard title="Logo" text="Add logo-doma.svg for brand consistency." icon={Globe} />
                    </div>
                    <div className="mt-4 grid gap-3 sm:grid-cols-2">
                      {featuredAssets.map((f) => (
                        <div key={f.label} className="rounded-2xl border border-slate-200 bg-white p-4">
                          <p className="text-xs font-bold uppercase tracking-[0.16em] text-slate-500">{f.label}</p>
                          <p className="mt-1 font-mono text-sm text-slate-900">{f.value}</p>
                        </div>
                      ))}
                    </div>
                  </Card>
                ) : null}
              </div>
            </div>

            <div className="mt-6 flex flex-wrap gap-2">
              {tabsForProfile.map((n) => (
                <button
                  key={n.key}
                  onClick={() => setTab(n.key)}
                  className={cn(
                    "rounded-full border px-4 py-2 text-sm font-semibold transition",
                    tab === n.key
                      ? "border-[#4b76f9] bg-[#4b76f9] text-white"
                      : "border-slate-200 bg-white text-slate-700 hover:border-[#4b76f9]/30 hover:text-[#3f63d8]"
                  )}
                >
                  {n.label}
                </button>
              ))}
            </div>

            <div className="mt-6 grid gap-6 xl:grid-cols-[1.35fr_0.65fr]">
              <Card className="p-5 sm:p-6">
                <SectionTitle subtitle="Profile content" title="About this wallet" right={<Pill>{shortWallet}</Pill>} />
                <div className="mt-4 grid gap-4 lg:grid-cols-2">
                  <DetailCard title="Bio" text={currentProfile.bio} icon={BookOpen} />
                  <DetailCard title="Location" text={currentProfile.location} icon={MapPin} />
                  <DetailCard title="Region" text={currentProfile.region} icon={Globe} />
                  <DetailCard title="Community" text={currentProfile.discord} icon={Bell} />
                </div>
                <div className="mt-4 grid gap-3 sm:grid-cols-2 xl:grid-cols-4">
                  {currentProfile.sectors.map((s) => <Pill key={s}>{s}</Pill>)}
                </div>
                <div className="mt-4 grid gap-3 sm:grid-cols-2 xl:grid-cols-4">
                  <LinkChip href={currentProfile.linkedin} label="LinkedIn" />
                  <LinkChip href={currentProfile.x} label="X / Twitter" />
                  <LinkChip href={currentProfile.github} label="GitHub" />
                  <LinkChip href={currentProfile.company} label="Company" />
                </div>
                <div className="mt-4 grid gap-3 md:grid-cols-2 xl:grid-cols-4">
                  {currentProfile.languages.map((lang) => (
                    <div key={lang} className="rounded-2xl border border-slate-200 bg-slate-50 p-4 text-sm font-semibold text-slate-700">{lang}</div>
                  ))}
                </div>
              </Card>

              <Card className="p-5 sm:p-6">
                <SectionTitle subtitle="Quick status" title="Live summary" right={<BadgeCheck className="text-[#4b76f9]" size={20} />} />
                <div className="mt-4 space-y-3">
                  <div className="rounded-3xl bg-slate-50 p-4"><p className="text-xs font-bold uppercase tracking-[0.16em] text-slate-500">Tokenized assets</p><p className="mt-1 text-3xl font-black text-slate-900">{currentProfile.stats.totalTokens}</p></div>
                  <div className="rounded-3xl bg-slate-50 p-4"><p className="text-xs font-bold uppercase tracking-[0.16em] text-slate-500">Portfolio value</p><p className="mt-1 text-3xl font-black text-slate-900">{currentProfile.stats.value}</p></div>
                  <div className="rounded-3xl bg-slate-50 p-4"><p className="text-xs font-bold uppercase tracking-[0.16em] text-slate-500">Identity level</p><p className="mt-1 text-xl font-black text-slate-900">{currentProfile.identity.level}</p></div>
                </div>
              </Card>
            </div>

            <div className="mt-6 grid gap-6 xl:grid-cols-[1fr_1fr]">
              <Card className="p-5 sm:p-6">
                <SectionTitle subtitle="Portfolio" title="Domains held" right={<Globe className="text-[#4b76f9]" size={20} />} />
                <div className="mt-5 space-y-3">
                  {currentProfile.domains && currentProfile.domains.length ? currentProfile.domains.map((d) => <DomainRow key={d.name} {...d} />) : <EmptyState title="No domains found" text="This wallet has no visible domain holdings in the dataset." />}
                </div>
              </Card>

              <Card className="p-5 sm:p-6">
                <SectionTitle subtitle="Market actions" title="Buy / sell history" right={<Activity className="text-[#4b76f9]" size={20} />} />
                <div className="mt-5 space-y-3">
                  {currentProfile.trades && currentProfile.trades.length ? currentProfile.trades.map((t) => <TradeRow key={t.time + "-" + t.item} {...t} />) : <EmptyState title="No trades found" text="This wallet has no visible buy/sell history in the dataset." />}
                </div>
              </Card>
            </div>

            <div className="mt-6 grid gap-6 xl:grid-cols-[1fr_0.9fr]">
              <Card className="p-5 sm:p-6">
                <SectionTitle subtitle="Asset ledger" title="Tokenized assets" right={<Coins className="text-[#4b76f9]" size={20} />} />
                <div className="mt-5 space-y-3">
                  {currentProfile.holdings && currentProfile.holdings.length ? currentProfile.holdings.map((h) => <HoldingRow key={h.asset} {...h} />) : <EmptyState title="No tokenized assets" text="This wallet has no visible tokenized assets in the dataset." />}
                </div>
              </Card>

              <Card className="p-5 sm:p-6">
                <SectionTitle subtitle="Onchain report" title="Why this matters" right={<TerminalSquare className="text-[#4b76f9]" size={20} />} />
                <div className="mt-4 space-y-4 text-sm leading-7 text-slate-700">
                  <p>This dashboard is designed as a modern Doma-inspired identity and portfolio view. It helps users see wallet activity, domains, and tokenized assets without a cluttered dark interface.</p>
                  <p>The layout prioritizes readable charts, bright brand colors, identity verification, searchable profiles, and a quick scan of ownership data.</p>
                  <div className="grid gap-3 sm:grid-cols-2">
                    <DetailCard title="Search" text="Enter a wallet, owner name, domain, or social handle to load another profile." icon={Search} />
                    <DetailCard title="Identity" text="Show profile, social links, and trust signals in one place." icon={ShieldCheck} />
                  </div>
                </div>
              </Card>
            </div>

            <footer className="mt-6 rounded-[30px] border border-[#4b76f9]/15 bg-[#4b76f9]/6 p-5 text-center shadow-sm">
              <p className="text-sm font-semibold text-slate-700">Built for Doma-style wallet analytics, domain profiling and DomainFi storytelling.</p>
              <p className="mt-2 text-xs text-slate-500">Replace the demo arrays with real API data when you connect Doma, wallet indexers, or onchain subgraphs.</p>
            </footer>
          </main>

          <audio ref={audioRef} autoPlay={false} loop={false} controls className="fixed bottom-4 right-4 z-50 rounded-2xl border border-slate-200 bg-white/90 p-2 shadow-xl backdrop-blur">
            <source src="./music.mp3" type="audio/mpeg" />
          </audio>

          <div className="fixed bottom-4 left-4 z-50 max-w-[320px] rounded-2xl border border-slate-200 bg-white/90 p-3 text-xs text-slate-600 shadow-xl backdrop-blur">
            Thêm file cùng thư mục với <span className="font-mono">index.html</span>:
            <div className="mt-2 font-mono text-[11px] leading-5 text-slate-700">avatar.png / bg.gif / bg.mp4 / music.mp3 / logo-doma.svg</div>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>

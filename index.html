<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>DOMA Identity — DomainFi Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:wght@400;500&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
:root{
  --p:#4b76f9;--p2:#3560e8;--p3:#6e96ff;
  --bg:#4b76f9;
  --bg2:#3a62e8;--bg3:#5d85ff;
  --card:rgba(255,255,255,0.10);
  --card-solid:#3a62e8;
  --card-light:rgba(255,255,255,0.14);
  --text:#ffffff;--text2:rgba(255,255,255,0.75);--text3:rgba(255,255,255,0.45);
  --border:rgba(255,255,255,0.18);--border2:rgba(255,255,255,0.10);
  --glow:rgba(255,255,255,0.12);
  --accent:#00e5c3;--accent2:#00c4a8;
  --warn:#ffb347;--danger:#ff6b6b;
  --success:#4ade80;
  --font-head:'Syne',sans-serif;--font-body:'Outfit',sans-serif;--font-mono:'DM Mono',monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font-family:var(--font-body);min-height:100vh;overflow-x:hidden}
#bg-canvas{position:fixed;inset:0;z-index:0;pointer-events:none}
.bg-media-layer{position:fixed;inset:0;z-index:1;object-fit:cover;width:100%;height:100%;opacity:0.15;pointer-events:none}
.bg-overlay{position:fixed;inset:0;z-index:2;background:linear-gradient(160deg,rgba(75,118,249,0.82) 0%,rgba(42,82,220,0.92) 60%,rgba(30,60,180,0.96) 100%);pointer-events:none}
.wrap{max-width:1400px;margin:0 auto;padding:0 24px;position:relative;z-index:10}

/* HEADER */
header{position:sticky;top:0;z-index:500;background:rgba(42,82,220,0.85);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border-bottom:1px solid var(--border)}
.header-inner{display:flex;align-items:center;justify-content:space-between;padding:13px 0;gap:16px;flex-wrap:wrap}
.logo-box{display:flex;align-items:center;gap:12px}
.logo-badge{width:42px;height:42px;border-radius:13px;background:rgba(255,255,255,0.2);border:1.5px solid rgba(255,255,255,0.3);display:flex;align-items:center;justify-content:center;font-size:20px;box-shadow:0 4px 16px rgba(0,0,0,0.2)}
.logo-title{font-family:var(--font-head);font-weight:800;font-size:20px;color:#fff;letter-spacing:-0.5px}
.logo-sub{font-size:11px;color:var(--text2);margin-top:1px}
.header-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:7px;padding:9px 18px;border-radius:50px;font-family:var(--font-body);font-size:13px;font-weight:600;cursor:pointer;transition:all 0.2s;border:none;outline:none;white-space:nowrap}
.btn-white{background:white;color:#3560e8;box-shadow:0 4px 14px rgba(0,0,0,0.15)}
.btn-white:hover{background:#f0f4ff;transform:translateY(-1px)}
.btn-ghost{background:rgba(255,255,255,0.12);color:white;border:1.5px solid rgba(255,255,255,0.25)}
.btn-ghost:hover{background:rgba(255,255,255,0.22);border-color:rgba(255,255,255,0.45)}
.btn-accent{background:var(--accent);color:#0d3028;box-shadow:0 4px 14px rgba(0,229,195,0.35)}
.btn-accent:hover{background:var(--accent2);transform:translateY(-1px)}
.btn-danger{background:var(--danger);color:white;box-shadow:0 4px 14px rgba(255,107,107,0.3)}
.live-dot{width:8px;height:8px;border-radius:50%;background:var(--success);animation:pdot 1.5s infinite;flex-shrink:0}
@keyframes pdot{0%,100%{opacity:1;transform:scale(1)}50%{opacity:0.5;transform:scale(1.4)}}

/* HERO */
.hero{padding:52px 0 36px;display:grid;grid-template-columns:1.1fr 0.9fr;gap:44px;align-items:center}
@media(max-width:960px){.hero{grid-template-columns:1fr;gap:28px;padding:32px 0 24px}}
.hero-eyebrow{display:inline-flex;align-items:center;gap:8px;padding:6px 14px;border-radius:50px;background:rgba(255,255,255,0.15);border:1px solid rgba(255,255,255,0.3);font-size:12px;font-weight:600;color:white;margin-bottom:20px}
.hero-h1{font-family:var(--font-head);font-size:54px;font-weight:800;line-height:1.06;letter-spacing:-2px;color:white}
@media(max-width:960px){.hero-h1{font-size:38px}}
.hero-h1 .hl{color:var(--accent)}
.hero-desc{margin-top:18px;font-size:16px;line-height:1.75;color:var(--text2);max-width:490px}
.hero-btns{display:flex;gap:12px;margin-top:28px;flex-wrap:wrap}
.hero-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:30px}
.hstat{background:rgba(255,255,255,0.12);border:1px solid rgba(255,255,255,0.2);border-radius:16px;padding:14px;text-align:center}
.hstat-val{font-family:var(--font-head);font-size:24px;font-weight:800;color:white}
.hstat-lbl{font-size:10px;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:0.12em;margin-top:3px}

/* PROFILE CARD */
.profile-card{background:rgba(255,255,255,0.13);border:1.5px solid rgba(255,255,255,0.25);border-radius:28px;padding:28px;backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);position:relative;overflow:hidden}
.profile-card::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(255,255,255,0.08) 0%,transparent 60%);pointer-events:none}
.profile-avatar-wrap{position:relative;width:84px;height:84px;margin-bottom:16px}
.profile-avatar{width:84px;height:84px;border-radius:22px;background:linear-gradient(135deg,rgba(255,255,255,0.3),rgba(255,255,255,0.1));border:2.5px solid rgba(255,255,255,0.4);display:flex;align-items:center;justify-content:center;font-size:38px;overflow:hidden}
.profile-avatar img{width:100%;height:100%;object-fit:cover;border-radius:19px}
.vbadge{position:absolute;bottom:-4px;right:-4px;width:22px;height:22px;border-radius:50%;background:var(--accent);border:2px solid rgba(75,118,249,0.8);display:flex;align-items:center;justify-content:center;font-size:10px}
.profile-name{font-family:var(--font-head);font-size:22px;font-weight:800;color:white}
.profile-handle{font-family:var(--font-mono);font-size:12px;color:var(--accent);margin-top:4px}
.profile-bio{font-size:13px;color:var(--text2);margin-top:10px;line-height:1.65}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.tag{padding:4px 11px;border-radius:50px;background:rgba(255,255,255,0.15);border:1px solid rgba(255,255,255,0.25);font-size:11px;font-weight:600;color:white}
.tag-accent{background:rgba(0,229,195,0.2);border-color:rgba(0,229,195,0.4);color:var(--accent)}
.sbar-wrap{margin-top:16px}
.sbar-label{display:flex;justify-content:space-between;font-size:12px;font-weight:600;color:var(--text2);margin-bottom:6px}
.sbar-track{height:7px;border-radius:4px;background:rgba(255,255,255,0.15);overflow:hidden}
.sbar-fill{height:100%;border-radius:4px;background:linear-gradient(90deg,white,var(--accent));transition:width 1.2s ease}
.social-row{display:flex;gap:7px;margin-top:14px;flex-wrap:wrap}
.slink{padding:6px 13px;border-radius:50px;background:rgba(255,255,255,0.14);border:1px solid rgba(255,255,255,0.22);font-size:12px;font-weight:600;color:white;text-decoration:none;transition:all 0.2s;display:flex;align-items:center;gap:5px}
.slink:hover{background:rgba(255,255,255,0.28)}

/* SEARCH */
.search-section{background:rgba(255,255,255,0.10);border:1.5px solid rgba(255,255,255,0.2);border-radius:24px;padding:22px;margin-bottom:28px;backdrop-filter:blur(16px)}
.search-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.search-iw{flex:1;min-width:200px;display:flex;align-items:center;gap:10px;background:rgba(255,255,255,0.12);border-radius:14px;padding:11px 16px;border:1.5px solid rgba(255,255,255,0.2);transition:border-color 0.2s}
.search-iw:focus-within{border-color:rgba(255,255,255,0.6)}
.search-iw input{flex:1;background:none;border:none;outline:none;font-family:var(--font-body);font-size:14px;color:white}
.search-iw input::placeholder{color:var(--text3)}
.recent-tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;align-items:center}
.rtag{padding:4px 11px;border-radius:50px;background:rgba(255,255,255,0.1);font-size:11px;font-weight:600;color:var(--text2);cursor:pointer;border:1px solid rgba(255,255,255,0.15);transition:all 0.2s}
.rtag:hover{background:rgba(255,255,255,0.22);color:white}

/* STAT CARDS */
.stat-card{background:rgba(255,255,255,0.10);border:1.5px solid rgba(255,255,255,0.18);border-radius:22px;padding:20px;transition:all 0.25s;position:relative;overflow:hidden;backdrop-filter:blur(12px)}
.stat-card:hover{transform:translateY(-3px);background:rgba(255,255,255,0.16);border-color:rgba(255,255,255,0.35)}
.stat-card::after{content:'';position:absolute;top:-20px;right:-20px;width:80px;height:80px;border-radius:50%;background:rgba(255,255,255,0.06);pointer-events:none}
.stat-icon{width:38px;height:38px;border-radius:11px;background:rgba(255,255,255,0.15);display:flex;align-items:center;justify-content:center;margin-bottom:12px;font-size:17px}
.stat-lbl{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.14em;color:var(--text2)}
.stat-val{font-family:var(--font-head);font-size:28px;font-weight:800;color:white;margin:5px 0}
.stat-delta{font-size:12px;font-weight:600;color:var(--success)}

/* CARD */
.card{background:rgba(255,255,255,0.10);border:1.5px solid rgba(255,255,255,0.18);border-radius:24px;padding:24px;backdrop-filter:blur(14px)}
.card-white{background:rgba(255,255,255,0.95);border:1.5px solid rgba(255,255,255,0.8);border-radius:24px;padding:24px;color:#1e3a8a}
.card-white .section-title{color:#1e3a8a}
.card-white .section-sub{color:#4b76f9}

/* NAV TABS */
.nav-tabs{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:24px;background:rgba(255,255,255,0.10);padding:7px;border-radius:18px;border:1.5px solid rgba(255,255,255,0.15)}
.ntab{padding:9px 16px;border-radius:12px;font-size:13px;font-weight:600;cursor:pointer;transition:all 0.2s;border:none;background:none;color:var(--text2)}
.ntab.active{background:white;color:#3560e8;box-shadow:0 3px 12px rgba(0,0,0,0.2)}
.ntab:hover:not(.active){background:rgba(255,255,255,0.15);color:white}

/* SECTION */
.sec-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;gap:12px;flex-wrap:wrap}
.section-title{font-family:var(--font-head);font-size:21px;font-weight:800;color:white}
.section-sub{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:0.16em;color:var(--text2);margin-bottom:4px}
.sbadge{padding:4px 12px;border-radius:50px;background:rgba(255,255,255,0.15);border:1px solid rgba(255,255,255,0.25);font-size:11px;font-weight:700;color:white}

/* GRIDS */
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:1100px){.g4{grid-template-columns:repeat(2,1fr)}}
@media(max-width:960px){.g3{grid-template-columns:1fr 1fr}}
@media(max-width:700px){.g2{grid-template-columns:1fr}.g3{grid-template-columns:1fr}.g4{grid-template-columns:1fr 1fr}}
@media(max-width:480px){.g4{grid-template-columns:1fr}}

/* DOMAIN TABLE */
.dtable{width:100%;border-collapse:collapse}
.dtable th{text-align:left;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:0.15em;color:var(--text2);padding:0 12px 12px;border-bottom:1px solid rgba(255,255,255,0.15)}
.drow:hover td{background:rgba(255,255,255,0.06)}
.drow td{padding:13px 12px;border-bottom:1px solid rgba(255,255,255,0.08);font-size:13px;font-weight:500;color:white;transition:background 0.15s}
.dname{font-family:var(--font-mono);font-weight:600;color:var(--accent)}
.hbar{height:6px;border-radius:3px;background:rgba(255,255,255,0.15);overflow:hidden;width:80px}
.hfill{height:100%;border-radius:3px;background:linear-gradient(90deg,white,var(--accent))}
.spill{padding:3px 10px;border-radius:50px;font-size:10px;font-weight:700}
.sp-owned{background:rgba(74,222,128,0.2);color:#4ade80}
.sp-frac{background:rgba(147,197,253,0.2);color:#93c5fd}
.sp-watch{background:rgba(253,211,77,0.2);color:#fcd34d}

/* TRADES */
.trade-card{background:rgba(255,255,255,0.08);border:1.5px solid rgba(255,255,255,0.14);border-radius:16px;padding:16px;display:flex;align-items:center;gap:14px;transition:all 0.2s;margin-bottom:10px}
.trade-card:hover{background:rgba(255,255,255,0.14);border-color:rgba(255,255,255,0.3);transform:translateX(4px)}
.ticon{width:42px;height:42px;border-radius:13px;display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0}
.tbuy{background:rgba(74,222,128,0.2)}
.tsell{background:rgba(255,107,107,0.2)}
.tinfo{flex:1}
.taction{font-size:13px;font-weight:700;color:white}
.tnote{font-size:12px;color:var(--text2);margin-top:2px}
.ttime{font-family:var(--font-mono);font-size:11px;color:var(--text3);margin-top:2px}
.tsize{font-family:var(--font-head);font-size:18px;font-weight:800;color:white}

/* HOLDINGS */
.hcard{background:rgba(255,255,255,0.08);border:1.5px solid rgba(255,255,255,0.14);border-radius:16px;padding:16px;display:grid;grid-template-columns:1fr auto auto auto;align-items:center;gap:16px;margin-bottom:10px;transition:all 0.2s}
.hcard:hover{background:rgba(255,255,255,0.13);border-color:rgba(255,255,255,0.28)}
@media(max-width:640px){.hcard{grid-template-columns:1fr 1fr}}

/* IDENTITY CHECK */
.idcheck{display:flex;align-items:center;gap:12px;background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.14);border-radius:16px;padding:13px;margin-bottom:10px}
.idcheck-icon{width:36px;height:36px;border-radius:11px;background:rgba(255,255,255,0.15);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:16px}
.idcheck-text{flex:1}
.idcheck-title{font-size:13px;font-weight:700;color:white}
.idcheck-sub{font-size:11px;color:var(--text2);margin-top:2px}

/* MEDIA STUDIO */
.mtabs{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap}
.mtab{padding:8px 16px;border-radius:50px;font-size:13px;font-weight:600;cursor:pointer;border:1.5px solid rgba(255,255,255,0.2);background:rgba(255,255,255,0.08);color:var(--text2);transition:all 0.2s}
.mtab.active{background:white;color:#3560e8;border-color:white}
.uzone{border:2px dashed rgba(255,255,255,0.3);border-radius:20px;padding:36px;text-align:center;background:rgba(255,255,255,0.05);transition:all 0.2s;cursor:pointer}
.uzone:hover,.uzone.drag{border-color:rgba(255,255,255,0.6);background:rgba(255,255,255,0.10)}
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:14px}
.mitem{border-radius:14px;overflow:hidden;position:relative;background:rgba(255,255,255,0.1);border:1.5px solid rgba(255,255,255,0.18);aspect-ratio:16/10}
.mitem img,.mitem video{width:100%;height:100%;object-fit:cover}
.moverlay{position:absolute;inset:0;background:rgba(13,27,62,0.7);opacity:0;transition:opacity 0.2s;display:flex;align-items:center;justify-content:center;gap:7px}
.mitem:hover .moverlay{opacity:1}
.mbtn{padding:5px 11px;border-radius:50px;background:white;color:#3560e8;font-size:10px;font-weight:700;cursor:pointer;border:none;transition:all 0.2s}
.mbtn:hover{background:var(--accent);color:#0d3028}
.mlabel{position:absolute;bottom:0;left:0;right:0;padding:5px 8px;background:rgba(0,0,0,0.65);font-size:9px;font-weight:600;color:white;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.active-bg-badge{position:absolute;top:5px;right:5px;background:var(--accent);color:#0d3028;font-size:8px;font-weight:800;padding:2px 7px;border-radius:50px}
.preview-panel{border-radius:18px;overflow:hidden;background:rgba(0,0,0,0.4);aspect-ratio:16/9;display:flex;align-items:center;justify-content:center;margin-top:14px}
.preview-panel video,.preview-panel img{width:100%;height:100%;object-fit:cover}

/* AUDIO PLAYER */
.audio-player{background:rgba(255,255,255,0.1);border:1.5px solid rgba(255,255,255,0.2);border-radius:20px;padding:20px;margin-top:14px}
.aplay-btn{width:42px;height:42px;border-radius:50%;background:white;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;color:#3560e8;font-size:16px;transition:all 0.2s;flex-shrink:0}
.aplay-btn:hover{transform:scale(1.08)}
.aprog-wrap{position:relative;height:4px;background:rgba(255,255,255,0.2);border-radius:2px;cursor:pointer;margin-top:8px}
.aprog{height:100%;background:var(--accent);border-radius:2px;transition:width 0.3s linear}
.vol-row{display:flex;align-items:center;gap:8px;margin-top:10px}
.vol-row input{flex:1;accent-color:var(--accent)}

/* FEATURES - ALL 8 */
.feat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.feat-card{background:rgba(255,255,255,0.09);border:1.5px solid rgba(255,255,255,0.17);border-radius:22px;padding:22px;transition:all 0.25s;position:relative;overflow:hidden}
.feat-card:hover{background:rgba(255,255,255,0.15);border-color:rgba(255,255,255,0.35);transform:translateY(-3px);box-shadow:0 12px 40px rgba(0,0,0,0.2)}
.feat-card::before{content:'';position:absolute;top:0;right:0;width:100px;height:100px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,0.07),transparent);pointer-events:none}
.feat-icon{font-size:32px;margin-bottom:14px;display:block}
.feat-title{font-family:var(--font-head);font-size:17px;font-weight:800;color:white;margin-bottom:8px}
.feat-desc{font-size:13px;color:var(--text2);line-height:1.65;margin-bottom:14px}
.feat-badge{display:inline-flex;align-items:center;gap:5px;padding:4px 11px;border-radius:50px;font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:0.1em;margin-bottom:12px}
.fb-hot{background:rgba(255,107,107,0.25);color:#ff6b6b;border:1px solid rgba(255,107,107,0.35)}
.fb-new{background:rgba(0,229,195,0.2);color:var(--accent);border:1px solid rgba(0,229,195,0.3)}
.fb-soon{background:rgba(255,179,71,0.2);color:var(--warn);border:1px solid rgba(255,179,71,0.3)}

/* FEATURE TOOLS - active UI for each feature */
.tool-panel{background:rgba(0,0,0,0.2);border-radius:16px;padding:16px;margin-top:4px;border:1px solid rgba(255,255,255,0.12)}
.tool-input{width:100%;background:rgba(255,255,255,0.12);border:1.5px solid rgba(255,255,255,0.2);border-radius:12px;padding:10px 14px;font-family:var(--font-body);font-size:13px;color:white;outline:none;transition:border-color 0.2s}
.tool-input:focus{border-color:rgba(255,255,255,0.55)}
.tool-input::placeholder{color:var(--text3)}
.tool-select{width:100%;background:rgba(255,255,255,0.12);border:1.5px solid rgba(255,255,255,0.2);border-radius:12px;padding:10px 14px;font-family:var(--font-body);font-size:13px;color:white;outline:none;cursor:pointer}
.tool-select option{background:#3560e8;color:white}
.tool-row{display:flex;gap:8px;align-items:center;margin-top:10px}
.tool-row label{font-size:12px;font-weight:600;color:var(--text2);white-space:nowrap}
.tool-result{background:rgba(0,229,195,0.12);border:1px solid rgba(0,229,195,0.25);border-radius:12px;padding:12px 14px;margin-top:10px;font-size:13px;color:var(--accent);font-weight:600;line-height:1.6}
.tool-result-red{background:rgba(255,107,107,0.12);border-color:rgba(255,107,107,0.25);color:#ff9090}
.progress-ring{display:flex;align-items:center;justify-content:center;flex-direction:column;gap:4px}
.heatmap-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:8px}
.hcell{aspect-ratio:1;border-radius:6px;transition:transform 0.2s;cursor:pointer;position:relative}

/* CANVAS */
function initCanvas(){
  const c=document.getElementById("bg-canvas");if(!c)return;
  const ctx=c.getContext("2d");let W,H;
  const pts=Array.from({length:70},()=>({
    x:Math.random()*2000,y:Math.random()*1200,
    r:Math.random()*2+0.4,dx:(Math.random()-0.5)*0.35,dy:(Math.random()-0.5)*0.35,
    o:Math.random()*0.35+0.08
  }));
  function resize(){W=c.width=window.innerWidth;H=c.height=window.innerHeight}
  resize();window.addEventListener("resize",resize);
  function draw(){
    ctx.clearRect(0,0,W,H);
    pts.forEach(p=>{
      p.x+=p.dx;p.y+=p.dy;
      if(p.x<0||p.x>W)p.dx*=-1;if(p.y<0||p.y>H)p.dy*=-1;
      ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
      ctx.fillStyle=`rgba(255,255,255,${p.o})`;ctx.fill();
    });
    ctx.strokeStyle="rgba(255,255,255,0.04)";ctx.lineWidth=1;
    for(let x=0;x<W;x+=80){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke()}
    for(let y=0;y<H;y+=80){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}
    requestAnimationFrame(draw);
  }
  draw();
}
setTimeout(initCanvas,80);

/* CHARTS */
function AreaChart({data}){
  if(!data||!data.length)return null;
  const W=700,H=200,pL=38,pR=14,pT=14,pB=28;
  const vals=data.map(d=>d.v);
  const max=Math.max(...vals,1);
  const uw=W-pL-pR,uh=H-pT-pB;
  const x=i=>pL+(data.length===1?uw/2:(i*uw)/(data.length-1));
  const y=v=>pT+(1-v/max)*uh;
  const pts=data.map((d,i)=>[x(i),y(d.v)]);
  const line=pts.map(([px,py],i)=>`${i===0?"M":"L"} ${px} ${py}`).join(" ");
  const base=H-pB;
  const area=`${line} L ${pts[pts.length-1][0]} ${base} L ${pts[0][0]} ${base} Z`;
  const gridVals=[0,.25,.5,.75,1].map(t=>({gy:pT+t*uh,lbl:Math.round(max*(1-t))}));
  return(
    <svg viewBox={`0 0 ${W} ${H}`} style={{width:"100%",height:"100%"}}>
      <defs>
        <linearGradient id="ag" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stopColor="rgba(255,255,255,0.3)"/>
          <stop offset="100%" stopColor="rgba(255,255,255,0.01)"/>
        </linearGradient>
      </defs>
      {gridVals.map((g,i)=>(
        <g key={i}>
          <line x1={pL} x2={W-pR} y1={g.gy} y2={g.gy} stroke="rgba(255,255,255,0.1)" strokeDasharray="3 3"/>
          <text x="4" y={g.gy+4} fontSize="9" fill="rgba(255,255,255,0.4)">{(g.lbl/1000).toFixed(0)}k</text>
        </g>
      ))}
      {data.map((d,i)=><text key={d.d} x={x(i)} y={H-6} fontSize="9" textAnchor="middle" fill="rgba(255,255,255,0.5)">{d.d}</text>)}
      <path d={area} fill="url(#ag)"/>
      <path d={line} fill="none" stroke="white" strokeWidth="2.5" strokeLinejoin="round" strokeLinecap="round"/>
      {pts.map(([px,py],i)=><circle key={i} cx={px} cy={py} r="3.5" fill="rgba(75,118,249,0.9)" stroke="white" strokeWidth="2"/>)}
    </svg>
  );
}

function PieChart({data}){
  const [active,setActive]=useState(0);
  if(!data||!data.length)return <div style={{textAlign:"center",padding:"30px",color:"rgba(255,255,255,0.4)"}}>No data</div>;
  const total=data.reduce((s,d)=>s+d.value,0)||1;
  const cx=120,cy=100,r=75;
  let cur=-90;
  const arcs=data.map((item,idx)=>{
    const sw=(item.value/total)*360;
    const s=cur,e=cur+sw;cur=e;
    const rad=a=>(Math.PI/180)*a;
    const sx=cx+r*Math.cos(rad(s)),sy=cy+r*Math.sin(rad(s));
    const ex=cx+r*Math.cos(rad(e)),ey=cy+r*Math.sin(rad(e));
    return{...item,idx,path:`M ${cx} ${cy} L ${sx} ${sy} A ${r} ${r} 0 ${sw>180?1:0} 1 ${ex} ${ey} Z`};
  });
  const act=arcs[active]||arcs[0];
  return(
    <div>
      <svg viewBox="0 0 240 200" style={{width:"100%",maxWidth:"240px",display:"block",margin:"0 auto"}}>
        {arcs.map((a,i)=>(
          <path key={i} d={a.path} fill={COLORS[i%COLORS.length]} opacity={i===active?1:0.7}
            onMouseEnter={()=>setActive(i)} style={{cursor:"pointer",transition:"opacity 0.2s"}}/>
        ))}
        <circle cx={cx} cy={cy} r="36" fill="rgba(42,82,220,0.95)"/>
        <text x={cx} y={cy-3} fontSize="11" fontWeight="700" textAnchor="middle" fill="white">{act?.name}</text>
        <text x={cx} y={cy+13} fontSize="10" textAnchor="middle" fill="rgba(255,255,255,0.6)">{act?.value}%</text>
      </svg>
      <div style={{display:"flex",flexWrap:"wrap",gap:"6px",marginTop:"10px",justifyContent:"center"}}>
        {data.map((d,i)=>(
          <button key={d.name} onMouseEnter={()=>setActive(i)}
            style={{display:"flex",alignItems:"center",gap:"5px",padding:"4px 10px",borderRadius:"50px",background:"rgba(255,255,255,0.1)",border:"1px solid rgba(255,255,255,0.2)",fontSize:"11px",fontWeight:"600",cursor:"pointer",color:"white"}}>
            <span style={{width:"8px",height:"8px",borderRadius:"50%",background:COLORS[i%COLORS.length],display:"inline-block"}}/>
            {d.name}·{d.value}%
          </button>
        ))}
      </div>
    </div>
  );
}

/* AUDIO PLAYER */
function AudioPlayer({src}){
  const aRef=useRef(null);
  const [playing,setPlaying]=useState(false);
  const [prog,setProg]=useState(0);
  const [vol,setVol]=useState(60);
  const [title,setTitle]=useState("No audio");

  useEffect(()=>{
    const a=aRef.current;if(!a)return;
    a.volume=vol/100;
    const upd=()=>setProg(a.duration?a.currentTime/a.duration*100:0);
    a.addEventListener("timeupdate",upd);
    a.addEventListener("ended",()=>setPlaying(false));
    return()=>a.removeEventListener("timeupdate",upd);
  },[vol]);

  useEffect(()=>{
    const a=aRef.current;if(!a||!src)return;
    a.src=src;setTitle(src.split("/").pop()||"Audio");
  },[src]);

  function toggle(){
    const a=aRef.current;if(!a)return;
    if(playing){a.pause();setPlaying(false);}
    else{const p=a.play();if(p&&p.catch)p.catch(()=>{});setPlaying(true);}
  }
  function seek(e){
    const a=aRef.current;if(!a||!a.duration)return;
    const r=e.currentTarget.getBoundingClientRect();
    a.currentTime=((e.clientX-r.left)/r.width)*a.duration;
  }

  return(
    <div className="audio-player">
      <audio ref={aRef} preload="metadata"/>
      <div style={{fontSize:"10px",fontWeight:"700",textTransform:"uppercase",letterSpacing:"0.14em",color:"rgba(255,255,255,0.5)",marginBottom:"12px"}}>🎵 Audio Player</div>
      <div style={{display:"flex",alignItems:"center",gap:"12px"}}>
        <button className="aplay-btn" onClick={toggle}>{playing?"⏸":"▶"}</button>
        <div style={{flex:1}}>
          <div style={{fontSize:"13px",fontWeight:"700",color:"white"}}>{title}</div>
          <div style={{fontSize:"11px",color:"rgba(255,255,255,0.5)",marginTop:"2px"}}>{src?"Click to seek":"Upload MP3 to play"}</div>
          <div className="aprog-wrap" onClick={seek}><div className="aprog" style={{width:`${prog}%`}}/></div>
        </div>
      </div>
      <div className="vol-row">
        <span style={{fontSize:"12px"}}>🔈</span>
        <input type="range" min="0" max="100" value={vol} onChange={e=>{setVol(+e.target.value);if(aRef.current)aRef.current.volume=+e.target.value/100;}}/>
        <span style={{fontSize:"11px",fontWeight:"600",color:"rgba(255,255,255,0.5)",width:"30px",textAlign:"right"}}>{vol}%</span>
      </div>
    </div>
  );
}

/* MEDIA STUDIO */
function MediaStudio({onSetBg}){
  const [tab,setTab]=useState("image");
  const [files,setFiles]=useState({image:[],video:[],audio:[]});
  const [bgItem,setBgItem]=useState(null);
  const [audioSrc,setAudioSrc]=useState(null);
  const [drag,setDrag]=useState(false);
  const fRef=useRef();

  function handleFiles(fList){
    const added={image:[],video:[],audio:[]};
    Array.from(fList).forEach(f=>{
      const url=URL.createObjectURL(f);
      const item={url,name:f.name,size:f.size,type:f.type};
      if(f.type.startsWith("image/"))added.image.push(item);
      else if(f.type.startsWith("video/"))added.video.push(item);
      else if(f.type.startsWith("audio/"))added.audio.push(item);
    });
    setFiles(prev=>({image:[...prev.image,...added.image],video:[...prev.video,...added.video],audio:[...prev.audio,...added.audio]}));
    if(added.audio.length)setAudioSrc(added.audio[0].url);
    toast(`✅ Tải lên ${Array.from(fList).length} file`);
  }

  function setBg(item){
    setBgItem(item);onSetBg(item);
    toast(`🎨 Đặt nền: ${item.name}`);
  }
  function remove(type,url){
    setFiles(prev=>({...prev,[type]:prev[type].filter(i=>i.url!==url)}));
    if(bgItem&&bgItem.url===url){setBgItem(null);onSetBg(null);}
    toast("🗑️ Đã xóa");
  }

  const cur=files[tab]||[];

  return(
    <div>
      <div className="mtabs">
        {[{k:"image",l:"🖼️ Ảnh"},{k:"video",l:"🎬 Video"},{k:"audio",l:"🎵 Âm thanh"}].map(t=>(
          <button key={t.k} className={`mtab${tab===t.k?" active":""}`} onClick={()=>setTab(t.k)}>{t.l}</button>
        ))}
      </div>
      <div className={`uzone${drag?" drag":""}`}
        onDragOver={e=>{e.preventDefault();setDrag(true)}}
        onDragLeave={()=>setDrag(false)}
        onDrop={e=>{e.preventDefault();setDrag(false);handleFiles(e.dataTransfer.files);}}
        onClick={()=>fRef.current?.click()}>
        <div style={{fontSize:"36px",marginBottom:"10px"}}>{tab==="image"?"🖼️":tab==="video"?"🎬":"🎵"}</div>
        <div style={{fontFamily:"var(--font-head)",fontSize:"16px",fontWeight:"700",color:"white",marginBottom:"6px"}}>Kéo thả hoặc click để upload</div>
        <div style={{fontSize:"12px",color:"rgba(255,255,255,0.5)"}}>
          {tab==="image"&&"JPG, PNG, GIF, WebP — đặt làm nền ngay lập tức"}
          {tab==="video"&&"MP4, WebM, MOV — video nền động cực ngầu"}
          {tab==="audio"&&"MP3, WAV, OGG — nhạc nền ambient"}
        </div>
        <input ref={fRef} type="file" multiple style={{display:"none"}}
          accept={tab==="image"?"image/*":tab==="video"?"video/*":"audio/*"}
          onChange={e=>handleFiles(e.target.files)}/>
      </div>
      {tab==="audio"&&<AudioPlayer src={audioSrc}/>}
      {tab==="video"&&cur[0]&&(
        <div>
          <div className="preview-panel"><video src={cur[0].url} controls style={{width:"100%",height:"100%",objectFit:"cover"}}/></div>
          <div style={{display:"flex",gap:"8px",marginTop:"10px",alignItems:"center"}}>
            <span style={{flex:1,fontSize:"12px",color:"rgba(255,255,255,0.5)"}}>Preview: {cur[0].name}</span>
            <button className="btn btn-accent" onClick={()=>setBg(cur[0])}>🎬 Đặt làm nền</button>
          </div>
        </div>
      )}
      {cur.length>0&&(
        <div className="mgrid" style={{marginTop:"14px"}}>
          {cur.map(item=>(
            <div key={item.url} className="mitem">
              {tab==="image"&&<img src={item.url} alt={item.name}/>}
              {tab==="video"&&<video src={item.url} muted/>}
              {tab==="audio"&&<div style={{display:"flex",alignItems:"center",justifyContent:"center",height:"100%",fontSize:"28px",background:"linear-gradient(135deg,rgba(255,255,255,0.15),rgba(255,255,255,0.05))"}}> 🎵</div>}
              {bgItem&&bgItem.url===item.url&&<div className="active-bg-badge">✓ Active</div>}
              <div className="moverlay">
                {tab!=="audio"&&<button className="mbtn" onClick={()=>setBg(item)}>🖼 Nền</button>}
                {tab==="audio"&&<button className="mbtn" onClick={()=>setAudioSrc(item.url)}>▶ Play</button>}
                <button className="mbtn" onClick={()=>remove(tab,item.url)}>🗑</button>
              </div>
              <div className="mlabel">{item.name}</div>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

function FeatureAIValuation(){

    if(!domain.trim())return;
    setLoading(true);setResult(null);

      const len=domain.replace(/\.[^.]+$/,"").length;
      const ext=domain.split(".").pop()||"xyz";

      setResult({est:`$${base.toLocaleString()}`,trend,risk,ext,keywords:len<=5?"Premium short":"Standard",score:Math.round(60+base/150)});

  const domains=["alpha.xyz","beta.io","core.ai","edge.xyz","flow.io","grid.ai","hub.xyz","ink.io","jet.ai","key.xyz","lite.io","mesh.ai","node.xyz","orbit.io","peak.ai","quad.xyz","ray.io","sync.ai","tech.xyz","unit.io","v3.ai","wave.xyz","xnet.io","yield.ai","zero.xyz"];

  function startBot(){
    setRunning(true);setLog(["🚀 Sniper bot khởi động..."]);

function App(){
  const [wallet,setWallet]=useState(DEMO_WALLET);
  const [query,setQuery]=useState(DEMO_WALLET);
  const [tab,setTab]=useState("overview");
  const [recent,setRecent]=useState([]);
  const [copied,setCopied]=useState(false);
  const [bgMedia,setBgMedia]=useState(null);
  const [showModal,setShowModal]=useState(false);
  const [walletInput,setWalletInput]=useState("");
  const [openFeature,setOpenFeature]=useState(null);

  function lookupProfile(raw){
    const q=normalize(raw.trim());if(!q)return PROFILES[0];
    let best=PROFILES[0],bs=-1;
    for(const p of PROFILES){
      const fields=[p.wallet,p.displayName,p.domaName,p.bio,p.location,p.linkedin,p.x,p.github,p.company,p.discord];
      for(const f of fields){
        if(normalize(f||"").includes(q)){
          const sc=f===p.wallet?100:f===p.domaName?95:f===p.displayName?90:60;
          if(sc>bs){bs=sc;best=p;}
        }
      }
      for(const d of(p.domains||[])){if(normalize(d.name).includes(q)&&80>bs){bs=80;best=p;}}
    }
    return best;
  }
  const profile=useMemo(()=>lookupProfile(wallet),[wallet]);

  function onSearch(){
    const p=lookupProfile(query);setWallet(p.wallet);setTab("overview");
    setRecent(prev=>[query.trim(),...prev.filter(x=>x!==query.trim())].filter(Boolean).slice(0,6));
    toast(`🔍 Found: ${p.displayName}`);
  }
  async function copyAddr(){
    try{await navigator.clipboard.writeText(wallet);setCopied(true);setTimeout(()=>setCopied(false),1500);toast("📋 Copied!");}
    catch{toast("⚠️ Cannot copy");}
  }
  function handleSetBg(item){
    setBgMedia(item);
    const v=document.getElementById("bg-video"),img=document.getElementById("bg-image");

                <div className="section-title" style={{marginBottom:"14px"}}>Social Profiles</div>
                {[["🐦","X / Twitter",profile.x],["💼","LinkedIn",profile.linkedin],["🐙","GitHub",profile.github],["🌐","Website",profile.company]].map(([ic,l,h])=>(
                  <a key={l} href={h} target="_blank" rel="noreferrer"
                    style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"12px 14px",borderRadius:"13px",background:"rgba(255,255,255,0.07)",border:"1px solid rgba(255,255,255,0.1)",textDecoration:"none",color:"white",fontSize:"13px",fontWeight:"600",marginBottom:"8px",transition:"all 0.2s"}}
                    onMouseEnter={e=>{e.currentTarget.style.background="rgba(255,255,255,0.15)";e.currentTarget.style.borderColor="rgba(255,255,255,0.3)"}}
                    onMouseLeave={e=>{e.currentTarget.style.background="rgba(255,255,255,0.07)";e.currentTarget.style.borderColor="rgba(255,255,255,0.1)"}}>
                    <span>{ic} {l}</span><span style={{color:"rgba(255,255,255,0.4)"}}>↗</span>
                  </a>
                ))}
              </div>
              <div className="card" style={{background:"rgba(0,0,0,0.25)"}}>
                <div style={{color:"rgba(255,255,255,0.4)",fontSize:"10px",fontWeight:"700",textTransform:"uppercase",letterSpacing:"0.14em",marginBottom:"10px"}}>Languages & Skills</div>
                <div style={{display:"flex",flexWrap:"wrap",gap:"8px",marginBottom:"14px"}}>
                  {(profile.languages||[]).map(l=><span key={l} style={{padding:"6px 13px",borderRadius:"50px",background:"rgba(255,255,255,0.1)",border:"1px solid rgba(255,255,255,0.2)",fontSize:"12px",fontWeight:"600",color:"white"}}>{l}</span>)}
                </div>
                <div style={{color:"rgba(255,255,255,0.4)",fontSize:"10px",fontWeight:"700",textTransform:"uppercase",letterSpacing:"0.14em",marginBottom:"8px"}}>Interests</div>
                <div style={{fontSize:"13px",color:"rgba(255,255,255,0.6)",lineHeight:"1.7"}}>Market narratives · Domain branding · Community engagement · DeFi protocols · NFT ecosystems · Emerging tech</div>
              </div>
            </div>
          </div>
        )}
      </main>

      <footer>
        <div className="wrap">
          <div className="foot-inner">
            <div className="foot-logo">🌐 DOMA Identity Dashboard</div>
            <div style={{fontSize:"13px",color:"rgba(255,255,255,0.5)"}}>DomainFi Analytics · Web3 Identity Layer · Built for domain holders</div>
            <div className="foot-links">
              {[["X",profile.x],["LinkedIn",profile.linkedin],["GitHub",profile.github],["marginla.xyz",profile.company]].map(([l,h])=>(
                <a key={l} href={h} target="_blank" rel="noreferrer">{l}</a>
              ))}
            </div>
            <div style={{fontSize:"11px",color:"rgba(255,255,255,0.3)",marginTop:"6px"}}>Connect real onchain API to go live · Doma indexers · Wallet subgraphs</div>
          </div>
        </div>
      </footer>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>

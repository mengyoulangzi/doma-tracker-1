    function useAmbientAudio(enabled) {
      const ctxRef = useRef(null);

      useEffect(() => {
        const start = async () => {
          if (!enabled) {
            try { await ctxRef.current?.close(); } catch (_) {}
            ctxRef.current = null;
            return;
          }

          if (ctxRef.current) return;
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (!AudioCtx) return;

          const ctx = new AudioCtx();
          const gain = ctx.createGain();
          gain.gain.value = 0.015;
          const filter = ctx.createBiquadFilter();
          filter.type = "lowpass";
          filter.frequency.value = 520;
          const osc1 = ctx.createOscillator();
          osc1.type = "sine";
          osc1.frequency.value = 196;
          const osc2 = ctx.createOscillator();
          osc2.type = "triangle";
          osc2.frequency.value = 294;
          osc1.connect(gain);
          osc2.connect(gain);
          gain.connect(filter);
          filter.connect(ctx.destination);
          osc1.start();
          osc2.start();
          ctxRef.current = ctx;
        };

        start();
        return () => {
          try { ctxRef.current?.close(); } catch (_) {}
          ctxRef.current = null;
        };
      }, [enabled]);
    }

    function slicePath(cx, cy, r, startAngle, endAngle) {
      const toRad = (a) => (Math.PI / 180) * a;
      const start = { x: cx + r * Math.cos(toRad(startAngle)), y: cy + r * Math.sin(toRad(startAngle)) };
      const end = { x: cx + r * Math.cos(toRad(endAngle)), y: cy + r * Math.sin(toRad(endAngle)) };
      const largeArc = endAngle - startAngle <= 180 ? 0 : 1;
      return `M ${cx} ${cy} L ${start.x} ${start.y} A ${r} ${r} 0 ${largeArc} 1 ${end.x} ${end.y} Z`;
    }

    function AreaChartSvg({ data }) {
      const width = 1000;
      const height = 320;
      const padLeft = 52;
      const padRight = 24;
      const padTop = 24;
      const padBottom = 38;

      const values = data.map((d) => d.volume);
      const max = Math.max(...values, 1);
      const min = 0;
      const usableW = width - padLeft - padRight;
      const usableH = height - padTop - padBottom;
      const x = (i) => padLeft + (data.length === 1 ? usableW / 2 : (i * usableW) / (data.length - 1));
      const y = (v) => padTop + (1 - (v - min) / (max - min || 1)) * usableH;
      const points = data.map((d, i) => [x(i), y(d.volume)]);
      const linePath = points.map(([px, py], i) => `${i === 0 ? "M" : "L"} ${px} ${py}`).join(" ");
      const baseline = height - padBottom;
      const areaPath = points.length > 0 ? `${linePath} L ${points[points.length - 1][0]} ${baseline} L ${points[0][0]} ${baseline} Z` : "";
      const gridLines = Array.from({ length: 5 }, (_, i) => {
        const t = i / 4;
        return { gy: padTop + t * usableH, label: Math.round(max * (1 - t)) };
      });

      return (
        <svg viewBox={`0 0 ${width} ${height}`} className="h-full w-full overflow-visible">
          <defs>
            <linearGradient id="volumeFill" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stopColor={PRIMARY} stopOpacity="0.32" />
              <stop offset="100%" stopColor={PRIMARY} stopOpacity="0.02" />
            </linearGradient>
          </defs>

          {gridLines.map((g, idx) => (
            <g key={idx}>
              <line x1={padLeft} x2={width - padRight} y1={g.gy} y2={g.gy} stroke="#e6eeff" strokeDasharray="4 4" />
              <text x="6" y={g.gy + 4} fontSize="10" fill="#8390a8">{g.label.toLocaleString()}</text>
            </g>
          ))}

          {data.map((d, i) => (
            <text key={d.day} x={x(i)} y={height - 10} fontSize="11" textAnchor="middle" fill="#8390a8">{d.day}</text>
          ))}

          {areaPath ? <path d={areaPath} fill="url(#volumeFill)" /> : null}
          {linePath ? <path d={linePath} fill="none" stroke={PRIMARY} strokeWidth="4" strokeLinejoin="round" strokeLinecap="round" /> : null}

          {points.map(([px, py], i) => <circle key={i} cx={px} cy={py} r="4.5" fill="#ffffff" stroke={PRIMARY} strokeWidth="3" />)}
        </svg>
      );
    }

    function PieChartSvg({ data }) {
      const [activeIndex, setActiveIndex] = useState(0);
      const total = data.reduce((sum, item) => sum + item.value, 0) || 1;
      const cx = 180;
      const cy = 140;
      const r = 96;
      let current = -90;
      const arcs = data.map((item, index) => {
        const sweep = (item.value / total) * 360;
        const start = current;
        const end = current + sweep;
        current = end;
        return { ...item, index, start, end, path: slicePath(cx, cy, r, start, end) };
      });
      const active = arcs[activeIndex] || arcs[0];

      return (
        <div className="flex h-full flex-col">
          <svg viewBox="0 0 360 280" className="w-full no-select">
            {arcs.map((arc, idx) => (
              <path key={idx} d={arc.path} fill={COLORS[idx % COLORS.length]} opacity={idx === activeIndex ? 1 : 0.82} onMouseEnter={() => setActiveIndex(idx)} style={{ cursor: "pointer" }} />
            ))}
            <circle cx={cx} cy={cy} r="52" fill="white" />
            <text x={cx} y={cy - 4} fontSize="16" fontWeight="700" textAnchor="middle" fill="#0f172a">{active ? active.name : "Mix"}</text>
            <text x={cx} y={cy + 16} fontSize="11" textAnchor="middle" fill="#64748b">{active ? `${active.value}%` : "Portfolio"}</text>
          </svg>
          <div className="mt-2 flex flex-wrap gap-2">
            {data.map((item, i) => (
              <button key={item.name} onMouseEnter={() => setActiveIndex(i)} className="inline-flex items-center gap-2 rounded-full border border-slate-200 bg-white px-3 py-2 text-xs font-semibold text-slate-700 transition hover:border-[#4b76f9]/30 hover:text-[#3f63d8]">
                <span className="inline-block h-2.5 w-2.5 rounded-full" style={{ background: COLORS[i % COLORS.length] }} />
                {item.name} · {item.value}%
              </button>
            ))}
          </div>
        </div>
      );
    }
